name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  BLENDER_VERSION: "4.2.23"
  BLENDER_SHA256: bea0eb3146be13eae6225409a117b215184f41b7f79e799f97cb3abb8f6dc404

jobs:
  release:
    name: Build extension zip and publish pre-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ~/blender.tar.xz
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64-${{ env.BLENDER_SHA256 }}

      - name: Download Blender ${{ env.BLENDER_VERSION }} (SHA-256 pinned)
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o ~/blender.tar.xz \
            "https://download.blender.org/release/Blender4.2/blender-${BLENDER_VERSION}-linux-x64.tar.xz"

      - name: Verify and unpack Blender
        run: |
          echo "${BLENDER_SHA256}  $HOME/blender.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/blender"
          tar -xf ~/blender.tar.xz -C "$HOME/blender" --strip-components=1
          echo "$HOME/blender" >> "$GITHUB_PATH"

      - name: Validate extension
        run: blender --command extension validate map_builder

      - name: Build extension zip (mtimes normalised to the commit time, D100)
        run: bash tools/build_extension.sh . dist

      - name: Reproducibility check (dry run only) - a second build from a fresh clone is byte-identical
        if: github.event_name == 'workflow_dispatch'
        run: |
          git init --quiet "$RUNNER_TEMP/fresh"
          git -C "$RUNNER_TEMP/fresh" fetch --quiet --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_SHA"
          git -C "$RUNNER_TEMP/fresh" checkout --quiet FETCH_HEAD
          bash tools/build_extension.sh "$RUNNER_TEMP/fresh" "$RUNNER_TEMP/dist2"
          a=$(sha256sum dist/*.zip | cut -d' ' -f1)
          b=$(sha256sum "$RUNNER_TEMP"/dist2/*.zip | cut -d' ' -f1)
          echo "build 1 SHA-256: $a"
          echo "build 2 SHA-256: $b"
          [ "$a" = "$b" ] || { echo "::error::extension zip is not reproducible"; exit 1; }

      - name: The extension zip ships the texture set (S3-TEX-ASSETS AC4) and the licence texts
        run: |
          shopt -s nullglob
          zips=(dist/*.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::expected exactly one extension zip in dist/, found ${#zips[@]}: ${zips[*]}"
            exit 1
          fi
          MB_EXTENSION_ZIP="${zips[0]}" python3 -m unittest tests.test_textures.ExtensionZipTest tests.test_manifest -v

      - name: Check manifest version matches the tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          manifest=$(sed -n 's/^version *= *"\(.*\)"/\1/p' map_builder/blender_manifest.toml | head -n1)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match blender_manifest.toml version ${manifest}"
            exit 1
          fi
          ls dist/*.zip

      - name: Upload zip as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: map_builder-extension
          path: dist/*.zip
          if-no-files-found: error

      - name: Create or update GitHub pre-release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.zip --clobber
          else
            if [ -f "docs/releases/${tag}.md" ]; then
              notes=(--notes-file "docs/releases/${tag}.md")
            else
              notes=(--generate-notes)
            fi
            gh release create "$tag" dist/*.zip --prerelease --title "$tag" "${notes[@]}"
          fi
