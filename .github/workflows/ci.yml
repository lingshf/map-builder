name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python ${{ matrix.python-version }} unit tests (no Blender)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -t . -v
      - name: Build and validate the SYNTHETIC fixture package (CLI)
        run: |
          python tools/mbmap_cli.py build --osm tests/fixtures/synthetic_area.osm --dem tests/fixtures/synthetic_dem.asc \
            --datum SYNTHETIC --dem-license "SYNTHETIC test data (no licence required)" \
            --osm-license "SYNTHETIC test fixture (hand-written OSM-format XML, not OpenStreetMap data; no licence required)" \
            --lat 47.0 --lon 8.0 --width 400 --height 300 --name synthetic_sample --out "$RUNNER_TEMP/synthetic_sample.mbmap"
          python tools/mbmap_cli.py validate "$RUNNER_TEMP/synthetic_sample.mbmap"

  csharp-reader:
    name: C# reference reader on the committed sample
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the frozen-reader step needs the v0.3.0 tag for git archive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Read and self-test examples/synthetic_sample.mbmap
        run: dotnet run -c Release --project examples/csharp/MbmapReader -- examples/synthetic_sample.mbmap
      - name: Capsule check parity with Python (hit/clear and work units per probe)
        run: python3 -m unittest tests.test_csharp_parity -v
      - name: A tampered copy must be rejected
        run: |
          python3 - "$RUNNER_TEMP/tampered.mbmap" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile("examples/synthetic_sample.mbmap") as zi, zipfile.ZipFile(sys.argv[1], "w", zipfile.ZIP_DEFLATED) as zo:
              for info in zi.infolist():
                  data = bytearray(zi.read(info))
                  if info.filename == "collision/map.mbcol":
                      data[200] ^= 1
                  zo.writestr(info, bytes(data))
          PY
          set +e
          dotnet run -c Release --no-build --project examples/csharp/MbmapReader -- "$RUNNER_TEMP/tampered.mbmap" | tee "$RUNNER_TEMP/out.txt"
          code=${PIPESTATUS[0]}
          set -e
          test "$code" = "1" && grep -q "INVALID: collision/map.mbcol: SHA-256 mismatch" "$RUNNER_TEMP/out.txt"
      - name: Frozen v0.3.0 readers accept a complete textured 2.1.0 package
        run: |
          set -e
          V030="$RUNNER_TEMP/v030"
          mkdir -p "$V030"
          git archive v0.3.0 map_builder tools examples/csharp examples/synthetic_sample.mbmap | tar -x -C "$V030"
          python3 -m tests.make_textured_fixture "$RUNNER_TEMP/textured.mbmap"
          # the v0.3.0 Python validator: no errors, and no warnings beyond the committed sample's own
          (cd "$V030" && python3 -m tools.mbmap_cli validate "$RUNNER_TEMP/textured.mbmap") | tee "$RUNNER_TEMP/tex.txt"
          (cd "$V030" && python3 -m tools.mbmap_cli validate "$GITHUB_WORKSPACE/examples/synthetic_sample.mbmap") | tee "$RUNNER_TEMP/sample.txt"
          grep -q "^VALID: 0 error(s)" "$RUNNER_TEMP/tex.txt"
          diff <(grep '^warning:' "$RUNNER_TEMP/tex.txt") <(grep '^warning:' "$RUNNER_TEMP/sample.txt")
          # the frozen v0.3.0 C# reader: must read the textured package unchanged (texture ignored)
          dotnet run -c Release --project "$V030/examples/csharp/MbmapReader" -- "$RUNNER_TEMP/textured.mbmap" | tee "$RUNNER_TEMP/tex-cs.txt"
          test "$(tail -n 1 "$RUNNER_TEMP/tex-cs.txt")" = "OK"
          # AC4: the frozen C# reader on the committed sample; same warnings as the archived v0.3.0 baseline
          dotnet run -c Release --project "$V030/examples/csharp/MbmapReader" -- "$GITHUB_WORKSPACE/examples/synthetic_sample.mbmap" | tee "$RUNNER_TEMP/sample-cs.txt"
          test "$(tail -n 1 "$RUNNER_TEMP/sample-cs.txt")" = "OK"
          dotnet run -c Release --project "$V030/examples/csharp/MbmapReader" -- "$RUNNER_TEMP/v030/examples/synthetic_sample.mbmap" > "$RUNNER_TEMP/base-cs.txt" 2>&1 || true
          diff <(grep -i '^warning' "$RUNNER_TEMP/sample-cs.txt") <(grep -i '^warning' "$RUNNER_TEMP/base-cs.txt")-Validator on the textured fixture (glTFast proxy, D66)
      - name: glTF-Validator on the textured fixture (glTFast proxy, D66)-Validator on the textured fixture (glTFast proxy, D66)        run: |
          set -e
          python3 -m tests.make_textured_fixture "$RUNNER_TEMP/textured2.mbmap"
          python3 -c "import zipfile,sys,os; open(os.path.join(os.environ['RUNNER_TEMP'],'fixture.glb'),'wb').write(zipfile.ZipFile(sys.argv[1]).read('visual/map.glb'))" "$RUNNER_TEMP/textured2.mbmap"
          npm install --prefix "$RUNNER_TEMP/gv" gltf-validator@2.0.0-dev.3.10
          cp tools/gltf_validate.js "$RUNNER_TEMP/gv/"
          node "$RUNNER_TEMP/gv/gltf_validate.js" "$RUNNER_TEMP/fixture.glb"
