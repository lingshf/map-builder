[project]
name = "map-builder"
version = "0.4.0"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["map_builder", "tools"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

# bpy.props.*Property(...) calls used as class annotations (Blender registration idiom) are not valid types
[[tool.mypy.overrides]]
module = "map_builder.blender.props"
disable_error_code = ["valid-type"]
