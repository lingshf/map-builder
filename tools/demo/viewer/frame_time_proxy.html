<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>frame-time-proxy</title>
  <style>
    html, body, canvas { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    #status { position: fixed; top: 6px; left: 8px; color: #fff; background: rgba(0,0,0,0.4); padding: 4px 6px; font: 12px monospace; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="status">starting...</div>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.min.js"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "./vendor/three.module.min.js";
    import { GLTFLoader } from "./vendor/jsm/loaders/GLTFLoader.js";

    const qs = new URLSearchParams(location.search);
    const warmup = Math.max(0, parseInt(qs.get("warmup") || "60", 10));
    const frames = Math.max(1, parseInt(qs.get("frames") || "300", 10));
    const runId = qs.get("run_id") || "";
    const passes = Math.max(1, parseInt(qs.get("passes") || "1", 10));
    const status = document.getElementById("status");

    const canvas = document.getElementById("c");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(1280, 720, false);
    renderer.setPixelRatio(1);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9fc4e8);
    scene.add(new THREE.HemisphereLight(0xcfe4ff, 0x777766, 1.0));
    const sun = new THREE.DirectionalLight(0xffffff, 2.2);
    sun.position.set(-300, 500, 250);
    scene.add(sun);
    const eye = [
      parseFloat(qs.get("eye_x") || "0"),
      parseFloat(qs.get("eye_y") || "-500"),
      parseFloat(qs.get("eye_z") || "300"),
    ];
    const target = [
      parseFloat(qs.get("target_x") || "0"),
      parseFloat(qs.get("target_y") || "0"),
      parseFloat(qs.get("target_z") || "0"),
    ];
    const lensMm = parseFloat(qs.get("lens_mm") || "35");
    const camera = new THREE.PerspectiveCamera(55, 1280 / 720, 0.5, 20000);
    camera.position.set(eye[0], eye[1], eye[2]);
    camera.lookAt(new THREE.Vector3(target[0], target[1], target[2]));
    if (Number.isFinite(lensMm) && lensMm > 0) {
      camera.setFocalLength(lensMm);
    }

    function detectRendererInfo(gl) {
      try {
        const ext = gl.getExtension("WEBGL_debug_renderer_info");
        if (!ext) return "unknown";
        return gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) || "unknown";
      } catch {
        return "unknown";
      }
    }

    async function sha256Hex(buffer) {
      const digest = await crypto.subtle.digest("SHA-256", buffer);
      const bytes = new Uint8Array(digest);
      return Array.from(bytes).map((b) => b.toString(16).padStart(2, "0")).join("");
    }

    async function postResult(result) {
      await fetch("/frame_time_proxy_result.json", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(result),
      });
    }

    const glbResponse = await fetch("./map.glb");
    const glbBuffer = await glbResponse.arrayBuffer();
    const glbSha256 = await sha256Hex(glbBuffer);
    const gltf = await new GLTFLoader().parseAsync(glbBuffer, "./");
    scene.add(gltf.scene);
    const rendererInfo = detectRendererInfo(renderer.getContext());

    const gl = renderer.getContext();
    const syncPixel = new Uint8Array(4);

    // Render work only: `passes` renders, then a GPU sync so the time is not hidden by frame pacing.
    function timeRenderWork() {
      const t0 = performance.now();
      for (let pass = 0; pass < passes; pass += 1) renderer.render(scene, camera);
      gl.finish();
      gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, syncPixel);
      return performance.now() - t0;
    }

    function median(values) {
      return [...values].sort((a, b) => a - b)[Math.floor(values.length / 2)];
    }

    const samples = [];
    const renderSamples = [];
    let index = 0;
    let last = performance.now();
    status.textContent = "running...";
    renderer.setAnimationLoop(async (now) => {
      const dt = now - last;
      last = now;
      const renderMs = timeRenderWork();
      if (index >= warmup) {
        samples.push(dt);
        renderSamples.push(renderMs);
      }
      index += 1;
      if (samples.length >= frames) {
        renderer.setAnimationLoop(null);
        const medianMs = median(samples);
        const result = {
          run_id: runId,
          glb_sha256: glbSha256,
          warmup_frames: warmup,
          measured_frames: frames,
          median_ms: medianMs,
          median_render_ms: median(renderSamples),
          passes,
          renderer: rendererInfo
        };
        status.textContent = `median ${medianMs.toFixed(3)}ms`;
        try {
          await postResult(result);
        } finally {
          document.title = `done ${medianMs.toFixed(3)}ms`;
        }
      }
    });
  </script>
</body>
</html>
